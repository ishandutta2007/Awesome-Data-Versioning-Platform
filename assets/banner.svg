<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmerText {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #a855f7; }
      100% { stop-color: #38bdf8; }
    }
    .node-1 { animation: pulseNode 3s infinite ease-in-out; transform-origin: 1000px 100px; }
    .node-2 { animation: pulseNode 4s infinite ease-in-out 1s; transform-origin: 1080px 200px; }
    .node-3 { animation: pulseNode 3.5s infinite ease-in-out 0.5s; transform-origin: 920px 220px; }
    .flow-path { stroke-dasharray: 10 5; animation: flowLine 15s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Animated Dynamic Background Elements (Kept in Background/Right Side) -->
  <g opacity="0.4">
    <circle cx="1000" cy="160" r="140" fill="url(#glow-grad)" />
    <!-- Network / Git Branch Nodes in background -->
    <path d="M 850 160 Q 920 100 1000 100 T 1120 160" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-path" />
    <path d="M 850 160 Q 920 220 1000 220 T 1120 160" fill="none" stroke="#c084fc" stroke-width="2" class="flow-path" />
    <line x1="850" y1="160" x2="1120" y2="160" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" />

    <circle cx="1000" cy="100" r="8" fill="#38bdf8" class="node-1" />
    <circle cx="1080" cy="200" r="10" fill="#c084fc" class="node-2" />
    <circle cx="920" cy="220" r="7" fill="#818cf8" class="node-3" />
    <circle cx="850" cy="160" r="9" fill="#38bdf8" />
    <circle cx="1120" cy="160" r="9" fill="#c084fc" />
  </g>

  <!-- Decorative Pills / Tags on Top-Right -->
  <g transform="translate(820, 40)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <text x="65" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Git for Data</text>
  </g>
  <g transform="translate(965, 40)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.8" />
    <text x="60" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📦 MLOps 2026</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp & High Contrast) -->
  <g transform="translate(70, 0)">
    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#text-grad)" filter="url(#glow)">
      Awesome Data Versioning
    </text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#ffffff">
      Platforms Ecosystem 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated guide to SaaS &amp; Open-Source Data Lake, Dataset &amp; Model Versioning Tools
    </text>

    <!-- Key Highlights / Feature Badges in Subtitle Area -->
    <g transform="translate(0, 250)">
      <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="14">✓ lakeFS</text>
      <text x="100" y="0" fill="#818cf8" font-family="monospace" font-size="14">✓ DVC</text>
      <text x="180" y="0" fill="#c084fc" font-family="monospace" font-size="14">✓ Dolt</text>
      <text x="260" y="0" fill="#f43f5e" font-family="monospace" font-size="14">✓ Nessie</text>
      <text x="350" y="0" fill="#10b981" font-family="monospace" font-size="14">✓ MLflow</text>
    </g>
  </g>
</svg>
